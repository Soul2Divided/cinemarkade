<div class="crt-screen">
    <!-- HUD Superior: Navegación fija -->
    <header class="arcade-hud">
        <div class="brand">
            <span class="logo-text">CINEMARKADE</span>
        </div>
        <div class="user-actions">
            <button type="button" class="hud-btn" (click)="openAuthModal()">
                <span class="pointer">▶</span> INICIAR SESIÓN
            </button>
        </div>
    </header>

    <!-- Contenido Principal: Grilla de Cartelera -->
    <main class="arcade-content">
        <section class="billboard-container">
            <h2 class="section-title">EN CARTELERA</h2>

            <div class="movies-grid">
                @for (movie of movies; track movie.id) {
                <article class="movie-card" (click)="selectMovie(movie)">
                    <div class="poster-wrapper">
                        <!-- Poster en HD pero con marco retro -->
                        <img [src]="movie.posterUrl" [alt]="movie.title" class="poster-img" />
                        <span class="badge-hall">{{ movie.hall }}</span>
                    </div>

                    <div class="movie-info">
                        <h3 class="movie-title">{{ movie.title }}</h3>
                        <p class="movie-meta">{{ movie.genre }} | {{ movie.duration }}</p>
                        <button type="button" class="btn-buy">
                            TICKETS <span class="price">${{ movie.price }}</span>
                        </button>
                    </div>
                </article>
                }
            </div>
        </section>

        <!-- Modal de Login/Invitado (Desplegable) -->
        @if (isAuthModalOpen) {
        <div class="modal-backdrop" (click)="closeAuthModal()">
            <div class="modal-window" (click)="$event.stopPropagation()">
                <button type="button" class="close-btn" (click)="closeAuthModal()">X</button>

                <!-- Alterna entre Login o Teclado de Invitado dentro del modal -->
                @if (modalView === 'options') {
                <div class="auth-options">
                    <h3 class="modal-title">ACCESO JUGADOR</h3>
                    <button type="button" class="action-btn text-yellow" (click)="modalView = 'guest'">
                        INGRESAR COMO INVITADO
                    </button>
                    <button type="button" class="action-btn text-white" routerLink="/login">
                        INICIAR SESIÓN
                    </button>
                </div>
                }
            </div>
        </div>
        }
    </main>

    <footer class="arcade-footer">
        <p class="insert-coin">SELECCIONA UNA PELÍCULA PARA COMPRAR TICKETS</p>
    </footer>
</div>
